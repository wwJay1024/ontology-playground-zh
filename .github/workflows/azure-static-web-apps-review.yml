name: Azure Static Web Apps (Review Branches)

on:
  push:
    branches:
      - review/**
  workflow_dispatch:

jobs:
  build_and_deploy_review:
    if: github.repository == 'microsoft/Ontology-Playground'
    runs-on: ubuntu-latest
    name: Build and Deploy Review Branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_ENABLE_AI_BUILDER: ${{ vars.VITE_ENABLE_AI_BUILDER || 'false' }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_OAUTH_BASE: ${{ secrets.VITE_GITHUB_OAUTH_BASE }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Deploy to Azure Static Web Apps (Preview)
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_PLANT_0BB1D2910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: build
          production_branch: main
          # Static preview only; never publish the optional api/ package.
        env:
          VITE_ENABLE_AI_BUILDER: ${{ vars.VITE_ENABLE_AI_BUILDER || 'false' }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_OAUTH_BASE: ${{ secrets.VITE_GITHUB_OAUTH_BASE }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

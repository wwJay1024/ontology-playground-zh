# GitHub Pages deployment
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 只改说明文档时不触发构建；课程内容在 content/ 下，仍然会触发
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - '.github/workflows-disabled/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Restore published catalogue payloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/catalogue-payloads
            public/catalogue-sources
            public/catalogue-payloads-manifest.json
          key: catalogue-payloads-${{ github.run_id }}
          restore-keys: |
            catalogue-payloads-

      # 首次部署时线上还没有站点，这一步拿不到清单，跳过即可
      - name: Restore payload history from current deployment
        continue-on-error: true
        run: >-
          npm run catalogue:restore --
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - run: npm run catalogue:build

      # 限制并行度：构建类测试会共用 public/ 目录，全速并发时偶发争用
      - run: npm test -- --maxWorkers=2

      - name: Build
        run: npm run build
        env:
          VITE_ENABLE_AI_BUILDER: ${{ vars.VITE_ENABLE_AI_BUILDER || 'false' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_OAUTH_BASE: ${{ secrets.VITE_GITHUB_OAUTH_BASE }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_DEPLOYED_COMMIT_SHA: ${{ github.sha }}
          VITE_REPOSITORY: ${{ github.repository }}

      - name: Preserve published catalogue payloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/catalogue-payloads
            public/catalogue-sources
            public/catalogue-payloads-manifest.json
          key: catalogue-payloads-${{ github.run_id }}

      - name: Copy SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
